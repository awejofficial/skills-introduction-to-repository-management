name: Validate

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  validate:
    name: Validate Python project
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Check dependency metadata
        run: python -m pip check

      - name: Validate Python syntax
        run: python -m compileall src

      - name: Run discovered unit tests (if any)
        run: |
          python - <<'PY'
          import sys
          import unittest

          suite = unittest.defaultTestLoader.discover("src", pattern="test_*.py")
          count = suite.countTestCases()
          print(f"Discovered {count} test(s).")
          if count == 0:
              print("No tests found; skipping execution.")
              sys.exit(0)

          result = unittest.TextTestRunner(verbosity=2).run(suite)
          sys.exit(0 if result.wasSuccessful() else 1)
          PY
