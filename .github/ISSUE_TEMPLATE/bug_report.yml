name: Bug report
description: Report a problem with the activities website or API.
title: "bug: "
labels:
  - bug
body:
  - type: markdown
    attributes:
      value: |
        Thanks for reporting a bug. Please provide enough detail for maintainers to reproduce it.
  - type: input
    id: summary
    attributes:
      label: Summary
      description: Short description of the bug.
      placeholder: Signup fails for valid student email
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      description: List exact steps.
      placeholder: |
        1. Start the app
        2. Open the activities page
        3. Try to register a student
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
      placeholder: Student is registered successfully.
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual behavior
      placeholder: API returns 401 with "Authentication required".
    validations:
      required: true
  - type: input
    id: endpoint
    attributes:
      label: Endpoint or page
      description: Include API route or frontend page URL.
      placeholder: /activities/Chess Club/signup
  - type: textarea
    id: logs
    attributes:
      label: Relevant logs or screenshots
      description: Paste errors, tracebacks, or screenshots.
      render: shell
  - type: checkboxes
    id: checks
    attributes:
      label: Confirmation
      options:
        - label: I searched existing issues before opening this report.
          required: true
        - label: I removed secrets and private student information from this report.
          required: true
